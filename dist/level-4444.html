<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LEVEL 4444</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Ein atmosphärisches Horror-Erlebnis. Kein Ziel, kein Scheitern, kein Ausweg außer einer Tür.">
<style>
  :root { color-scheme: dark; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    user-select: none;
  }

  body {
    font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    cursor: none;
  }

  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ------------------------------------------------ loading / start (§6) */

  #boot {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.2em;
    background: #000;
    cursor: pointer;
    transition: opacity 1.3s ease-in-out;
    padding: 2rem;
    text-align: center;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  /* §6 — one line of text on black. No progress bar. */
  .boot-line {
    color: #8f9799;
    font-size: clamp(0.95rem, 3.6vw, 1.35rem);
    letter-spacing: 0.055em;
    font-weight: 400;
    animation: breathe 7s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.42; }
    50%      { opacity: 0.88; }
  }

  #boot-hint {
    color: #4a5153;
    font-size: clamp(0.62rem, 2.4vw, 0.76rem);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
  }
  #boot-hint.show { opacity: 0.62; }

  /* The loading screen is the only place §6 allows the controls to be named.
     A mouse-look game has to say so once, or the player never finds it. */
  #boot-keys {
    color: #39413f;
    font-size: clamp(0.58rem, 2.1vw, 0.70rem);
    letter-spacing: 0.30em;
    text-transform: uppercase;
  }

  /* Shown only when something has gone wrong. A dead black screen tells the
     player nothing; this tells them what broke and on which step. */
  #boot-error {
    color: #7d6a66;
    font-size: clamp(0.60rem, 2.3vw, 0.72rem);
    letter-spacing: 0.06em;
    line-height: 1.7;
    max-width: 34em;
    opacity: 0;
    transition: opacity 0.6s ease-in-out;
  }
  #boot-error.show { opacity: 0.85; }

  /* -------------------------------------------- the one title card (§2.4) */

  #rec {
    position: fixed;
    left: 1.4rem;
    bottom: 1.4rem;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s linear;
    line-height: 1.55;
    font-size: clamp(0.66rem, 2.7vw, 0.82rem);
    letter-spacing: 0.14em;
    color: #c8cdcd;
    text-shadow: 0 0 6px rgba(0,0,0,0.85), 0 0 22px rgba(0,0,0,0.6);
    mix-blend-mode: screen;
  }
  /* The flicker drives a variable, not `opacity` directly. Writing opacity
     inline outranks this rule, so removing `.show` could not hide the stamp:
     it stayed on screen for the rest of the run with a frozen timecode, which
     reads exactly like a game that has hung. */
  #rec.show { opacity: var(--rec-flicker, 0.82); }

  #rec .dot {
    color: #d24a3a;
    animation: recblink 1.6s steps(1, end) infinite;
  }
  @keyframes recblink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }

  #rec .title {
    letter-spacing: 0.30em;
    color: #9fa6a7;
  }

  /* -------------------------------------------------- the last card (§4) */

  #end-card {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2.6s ease-in;
  }
  #end-card.show { opacity: 1; }

  #end-text {
    color: #b8bdbd;
    font-size: clamp(1.1rem, 5vw, 1.7rem);
    letter-spacing: 0.52em;
    text-indent: 0.52em;   /* balance the trailing letter-space */
    font-weight: 400;
    animation: tubeflicker 9s steps(1, end) infinite;
  }

  /* The fluorescent light in whatever room this is has seen better decades. */
  @keyframes tubeflicker {
    0%, 4%, 8%, 100% { opacity: 0.92; }
    5%               { opacity: 0.34; }
    6%               { opacity: 0.95; }
    41%              { opacity: 0.55; }
    42%              { opacity: 0.93; }
  }

  @media (prefers-reduced-motion: reduce) {
    .boot-line, #rec .dot, #end-text { animation: none; opacity: 0.85; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<!-- §6 — the loading screen is one line, and it is also the instruction -->
<div id="boot">
  <div class="boot-line">Halt still, wenn es dunkel wird.</div>
  <div id="boot-keys">Maus &middot; W / Leertaste &middot; Loslassen</div>
  <div id="boot-hint">Klicken zum Beginnen &middot; Kopfhörer empfohlen</div>
  <div id="boot-error"></div>
</div>

<!-- §2.4 — appears once, for four seconds, and never again -->
<div id="rec">
  <div>REC <span class="dot">&#9679;</span> <span id="rec-time">00:00:00</span></div>
  <div class="title">LEVEL 4444</div>
</div>

<div id="end-card"><div id="end-text">LEVEL 2</div></div>

<script>
/* Boot trap. Runs before the game so it also catches a parse error in the
 * bundle, which otherwise leaves nothing on screen but the loading line.
 * This ships in the release build on purpose: the level is distributed as a
 * link, and a player on a device I cannot test deserves a reason, not a
 * black rectangle. */
(function () {
  var seen = false;
  window.__bootFail = function (msg) {
    if (seen) return;
    seen = true;
    var el = document.getElementById('boot-error');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    var hint = document.getElementById('boot-hint');
    if (hint) hint.classList.remove('show');
  };
  window.addEventListener('error', function (e) {
    window.__bootFail('Start fehlgeschlagen — ' + (e.message || 'unbekannter Fehler'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__bootFail('Start fehlgeschlagen — ' + ((r && r.message) || r || 'unbekannter Fehler'));
  });
})();
</script>
