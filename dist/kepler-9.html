<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bahnhof Kepler-9</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="description" content="Ein verlassener Weltraumbahnhof, langsam von Pflanzen überwachsen. Frei begehbar.">
<style>
  :root { color-scheme: dark; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05080a;
    user-select: none;
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    cursor: none;
  }

  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ------------------------------------------------------ loading / start */

  #boot {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.6em;
    padding: 2rem;
    text-align: center;
    background: #05080a;
    cursor: pointer;
    transition: opacity 1.6s ease-in-out;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  #boot-title {
    color: #8fa79c;
    font-size: clamp(1.4rem, 5.4vw, 2.4rem);
    font-weight: 300;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
  }

  #boot-line {
    color: #5d6d70;
    font-size: clamp(0.85rem, 3vw, 1.02rem);
    font-weight: 300;
    letter-spacing: 0.05em;
    min-height: 1.4em;
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.92; } }

  #boot-keys {
    color: #3d4a4c;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(0.6rem, 2.2vw, 0.72rem);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    line-height: 2.1;
  }

  #boot-hint {
    color: #6c8078;
    font-size: clamp(0.64rem, 2.4vw, 0.78rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
  }
  #boot-hint.show { opacity: 0.75; }

  #boot-error {
    color: #7d6a66;
    font-size: clamp(0.6rem, 2.3vw, 0.74rem);
    letter-spacing: 0.04em;
    line-height: 1.7;
    max-width: 36em;
    opacity: 0;
    transition: opacity 0.6s ease-in-out;
  }
  #boot-error.show { opacity: 0.9; }

  /* ------------------------------------------------------------- in-scene */

  /* The five lines the hall gets to say. */
  #moment {
    position: fixed;
    left: 0; right: 0;
    bottom: 13vh;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55em;
    padding: 0 2rem;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease-in-out, transform 1.4s ease-in-out;
    transform: translateY(6px);
  }
  #moment.show { opacity: 1; transform: translateY(0); }

  #moment-text {
    color: #d3ded6;
    font-size: clamp(1rem, 3.4vw, 1.35rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 20px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8);
  }

  #moment-sub {
    color: #8b9a92;
    font-size: clamp(0.72rem, 2.5vw, 0.92rem);
    font-weight: 300;
    letter-spacing: 0.1em;
    text-shadow: 0 1px 16px rgba(0,0,0,0.9);
  }

  /* The controls, once, quietly, then gone. `H` brings them back. */
  #hint {
    position: fixed;
    left: 50%;
    bottom: 2.2rem;
    transform: translateX(-50%);
    z-index: 25;
    color: #4d5c5e;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(0.56rem, 2vw, 0.68rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0.62;
    pointer-events: none;
    transition: opacity 2.2s ease-in-out;
    text-shadow: 0 1px 12px rgba(0,0,0,0.9);
  }
  #hint.gone { opacity: 0; }

  @media (max-width: 620px) {
    #hint { font-size: 0.52rem; letter-spacing: 0.12em; }
  }

  @media (prefers-reduced-motion: reduce) {
    #boot-line { animation: none; opacity: 0.85; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="boot">
  <div id="boot-title">KEPLER-9</div>
  <div id="boot-line">Wird geladen …</div>
  <div id="boot-keys">
    Maus &middot; Umsehen<br>
    W A S D &middot; Gehen &nbsp;·&nbsp; Shift &middot; Schneller &nbsp;·&nbsp; Leertaste &middot; Springen<br>
    F &middot; Schwerelos &nbsp;·&nbsp; M &middot; Ton &nbsp;·&nbsp; H &middot; Hinweis &nbsp;·&nbsp; R &middot; Zurück zum Anfang
  </div>
  <div id="boot-hint">Klicken zum Betreten &middot; Kopfhörer empfohlen</div>
  <div id="boot-error"></div>
</div>

<div id="moment">
  <div id="moment-text"></div>
  <div id="moment-sub"></div>
</div>

<div id="hint">WASD gehen &middot; Maus umsehen &middot; F schwerelos &middot; H ausblenden</div>

<script>
/* Boot trap, before the bundle, so a parse error in the scene code still has
 * somewhere to be reported. A dark hall and a dead renderer look the same. */
(function () {
  var seen = false;
  window.__bootFail = function (msg) {
    if (seen) return;
    seen = true;
    var el = document.getElementById('boot-error');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    var b = document.getElementById('boot');
    if (b) b.classList.remove('gone');
    var hint = document.getElementById('boot-hint');
    if (hint) hint.classList.remove('show');
  };
  window.addEventListener('error', function (e) {
    window.__bootFail('Start fehlgeschlagen — ' + (e.message || 'unbekannter Fehler'));
  });
  /* Capture phase: a module that fails to load fires its error on the element
   * and never reaches the handler above. Double-clicking this file is the
   * usual way to get here — browsers refuse ES modules over file://. */
  window.addEventListener('error', function (e) {
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
      window.__bootFail(
        'Diese Datei lässt sich nicht direkt vom Dateisystem öffnen — Browser '
        + 'verbieten ES-Module über file://. Nimm dist/kepler-9.html (eine '
        + 'einzige Datei, läuft per Doppelklick) oder starte einen Server: '
        + 'node tools/serve.mjs und dann /station.html');
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__bootFail('Start fehlgeschlagen — ' + ((r && r.message) || r || 'unbekannter Fehler'));
  });
})();
</script>
